# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

dotenv: ['.env']

# env:

# vars:

includes:
  packer:
    taskfile: ./taskfiles/packer.yml
  tart:
    taskfile: ./taskfiles/tart.yml
  fedora:
    taskfile: ./taskfiles/fedora.yml

tasks:
  default:
    desc: "Default task"
    cmds:
      - task --list
