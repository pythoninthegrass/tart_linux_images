version: "3"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

includes:
  packer:
    taskfile: ./packer.yml
    dir: "{{.ROOT_DIR}}"
    internal: true
  tart:
    taskfile: ./tart.yml
    dir: "{{.ROOT_DIR}}"
    internal: true

vars:
  FEDORA_RELEASE: "44"
  IMAGE_URL: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-44-1.7.aarch64.qcow2"
  IMAGE_SHA256: "55c60a3b80d3616a08705afd0459e75fe9f03c54aba7a46e4002a41a72fa0d5b"
  CACHE_DIR: "{{.ROOT_DIR}}/.cache/images"
  QCOW2_IMAGE: "{{.CACHE_DIR}}/fedora-{{.FEDORA_RELEASE}}.qcow2"
  RAW_IMAGE: "{{.CACHE_DIR}}/fedora-{{.FEDORA_RELEASE}}.raw"
  BASE_VM: "fedora-44-base"
  VM_NAME: "fedora-44-kde"
  CPUS: 8
  MEMORY_GB: 16
  DISK_GB: 100
  DISPLAY: "2560x1440"
  SSH_USERNAME: admin
  SSH_PASSWORD: admin
  UTM_QCOW2: "{{.CACHE_DIR}}/{{.VM_NAME}}-utm.qcow2"

tasks:
  download:
    desc: Download and checksum the Fedora cloud image
    generates:
      - "{{.QCOW2_IMAGE}}"
    status:
      - test -f {{.QCOW2_IMAGE}}
    cmds:
      - mkdir -p {{.CACHE_DIR}}
      - curl -fL -o {{.QCOW2_IMAGE}} {{.IMAGE_URL}}
      - |
        echo "{{.IMAGE_SHA256}}  {{.QCOW2_IMAGE}}" | shasum -a 256 -c -

  base:
    desc: Create the base Fedora Tart VM from the cloud image
    deps:
      - download
    status:
      - tart list | awk '{print $2}' | grep -qx {{.BASE_VM}}
    cmds:
      - qemu-img convert -p -f qcow2 -O raw {{.QCOW2_IMAGE}} {{.RAW_IMAGE}}
      - tart create --linux {{.BASE_VM}}
      - mv {{.RAW_IMAGE}} ~/.tart/vms/{{.BASE_VM}}/disk.img

  build:
    desc: "Build the Fedora KDE Plasma image (usage: task fedora:build [VM_NAME=...])"
    deps:
      - base
    cmds:
      - |
        if tart list | awk '{print $2}' | grep -qx {{.VM_NAME}}; then
          echo "{{.VM_NAME}} already exists"
          read -p "Delete and rebuild? [y/N] " confirm
          [[ "$confirm" == "y" || "$confirm" == "Y" ]] || exit 1
          tart delete {{.VM_NAME}}
        fi
        true
      - task: packer:_cloud-init-iso
        vars:
          USER_DATA: cloud-init/user-data.distro-without-admin-group
          HOSTNAME: fedora-kde
      - |
        packer build \
          -var "vm_base_name={{.BASE_VM}}" \
          -var "vm_name={{.VM_NAME}}" \
          -var "cpu_count={{.CPUS}}" \
          -var "memory_gb={{.MEMORY_GB}}" \
          -var "disk_size_gb={{.DISK_GB}}" \
          -var "display={{.DISPLAY}}" \
          -var "ssh_username={{.SSH_USERNAME}}" \
          -var "ssh_password={{.SSH_PASSWORD}}" \
          -var "playbook=customizations/fedora-kde.yml" \
          {{.ROOT_DIR}}

  verify:
    desc: "Run the verification playbook against a running VM (usage: task fedora:verify [VM_NAME=...])"
    cmds:
      - |
        uv run ansible-playbook \
          -i "$(tart ip {{.VM_NAME}}),"  \
          -u {{.SSH_USERNAME}} \
          --ssh-extra-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no -o PasswordAuthentication=yes" \
          --extra-vars "ansible_ssh_pass={{.SSH_PASSWORD}}" \
          customizations/fedora-kde-verify.yml

  run:
    desc: "Run the Fedora KDE VM (usage: task fedora:run [VM_NAME=...])"
    cmds:
      - task: tart:run
        vars:
          CLI_ARGS: "{{.VM_NAME}}"

  utm:
    desc: "Export the Fedora KDE VM's disk to a UTM VM with virgl (usage: task fedora:utm [VM_NAME=...])"
    cmds:
      - mkdir -p {{.CACHE_DIR}}
      - qemu-img convert -p -f raw -O qcow2 ~/.tart/vms/{{.VM_NAME}}/disk.img {{.UTM_QCOW2}}
      - osascript scripts/utm-create.applescript "{{.VM_NAME}}" "{{.UTM_QCOW2}}" "{{.CPUS}}" "{{.MEMORY_GB}}"
