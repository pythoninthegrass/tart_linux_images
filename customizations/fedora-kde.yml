---
- name: Configure Fedora with KDE Plasma Desktop
  hosts: default
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:

    # dnf5 module requires python3-libdnf5, not present on the Fedora cloud image.
    - name: Bootstrap python3-libdnf5
      ansible.builtin.command: dnf -y install python3-libdnf5
      when: "'python3-libdnf5' not in ansible_facts.packages"
      changed_when: true

    - name: Install KDE Plasma desktop and supporting packages
      ansible.builtin.dnf5:
        name:
          - "@kde-desktop-environment"
          - firefox
          - alsa-utils
          - spice-vdagent
          - mesa-dri-drivers
          - mesa-vulkan-drivers
          # Carries virtio_snd, snd-hda-intel, etc., absent from the cloud image's kernel-modules-core; see docs/development.md.
          - kernel-modules
        state: present

    - name: Configure plasmalogin autologin user
      ansible.builtin.lineinfile:
        path: /etc/plasmalogin.conf
        regexp: '^#?User=.*'
        line: "User={{ ansible_user }}"
        backup: true

    - name: Configure plasmalogin session
      ansible.builtin.lineinfile:
        path: /etc/plasmalogin.conf
        regexp: '^#?Session=.*'
        line: "Session=plasma"
        backup: true

    - name: Enable plasmalogin
      ansible.builtin.systemd:
        name: plasmalogin
        enabled: true

    # spice-vdagentd is a static unit; socket activation starts it, nothing to enable. See docs/development.md.

    - name: Set default systemd target to graphical
      ansible.builtin.command: systemctl set-default graphical.target
      register: set_default_target
      changed_when: "'Removed' in set_default_target.stdout or 'Created' in set_default_target.stdout"
