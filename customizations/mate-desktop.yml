---
- name: Configure Ubuntu with MATE Desktop
  hosts: default
  become: true
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Create APT configuration file
      ansible.builtin.copy:
        content: |
          Dpkg::Options::="--force-confold";
          Dpkg::Options::="--force-unsafe-io";
          Acquire::Queue-Mode "host";
        dest: /etc/apt/apt.conf.d/99redballoons
        mode: '0644'

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install MATE desktop environment
      ansible.builtin.apt:
        name:
          - mate-desktop-environment-extras
        state: present
        install_recommends: true

    - name: Install additional packages
      ansible.builtin.apt:
        name:
          - acl
          - build-essential
          - curl
          - git
          - lightdm
          - lightdm-gtk-greeter
          - openssh-server
          - wget
          - xinit
          - xorg
        state: present

    - name: Set MATE as default session
      ansible.builtin.alternatives:
        name: x-session-manager
        path: /usr/bin/mate-session

    - name: Ensure LightDM config directory exists
      ansible.builtin.file:
        path: /etc/lightdm
        state: directory
        mode: '0755'

    - name: Create LightDM configuration file
      ansible.builtin.copy:
        content: |
          [Seat:*]
          autologin-user={{ ansible_user }}
          autologin-user-timeout=0
          user-session=mate
          greeter-session=lightdm-gtk-greeter
          greeter-hide-users=false
          greeter-show-manual-login=true
        dest: /etc/lightdm/lightdm.conf
        mode: '0644'
        backup: true

    - name: Create display-manager.service symlink to lightdm
      ansible.builtin.file:
        src: /lib/systemd/system/lightdm.service
        dest: /etc/systemd/system/display-manager.service
        state: link
        force: true

    - name: Create graphical.target.wants directory
      ansible.builtin.file:
        path: /etc/systemd/system/graphical.target.wants
        state: directory
        mode: '0755'

    - name: Create lightdm service symlink in graphical.target.wants
      ansible.builtin.file:
        src: /lib/systemd/system/lightdm.service
        dest: /etc/systemd/system/graphical.target.wants/lightdm.service
        state: link
        force: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Create .Xauthority file
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.Xauthority"
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Create .xinitrc
      ansible.builtin.copy:
        content: |
          #!/bin/sh

          if [ -f ~/.Xresources ]; then
            xrdb -merge ~/.Xresources
          fi

          exec mate-session
        dest: "{{ ansible_user_dir }}/.xinitrc"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Set graphical target
      ansible.builtin.systemd:
        name: graphical.target
        state: started
        enabled: true

    - name: Disable snapd service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      with_items:
        - snapd.service
        - snapd.socket
      ignore_errors: true

    - name: Mask snapd service and socket
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      with_items:
        - snapd.service
        - snapd.socket
      ignore_errors: true

